<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 440" width="100%" height="auto">
  <defs>
    <linearGradient id="copy-bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0e131b" />
      <stop offset="100%" stop-color="#161c26" />
    </linearGradient>
    <filter id="copy-shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#000000" flood-opacity="0.45" />
    </filter>
    <filter id="toast-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#30D158" flood-opacity="0.35" />
    </filter>
    <clipPath id="highlight-clip">
      <rect id="highlight-rect-clip" x="0" y="38" width="0" height="26" rx="4">
        <animate attributeName="width"
          values="0; 0; 530; 530; 530; 0"
          keyTimes="0; 0.12; 0.36; 0.82; 0.90; 1.0"
          dur="4.5s" repeatCount="indefinite"
          calcMode="spline"
          keySplines="0.23 1 0.32 1; 0.23 1 0.32 1; 0.23 1 0.32 1; 0.23 1 0.32 1; 0.23 1 0.32 1" />
      </rect>
    </clipPath>
  </defs>

  <style>
    .window-title { font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Text', sans-serif; font-size: 12px; font-weight: 600; fill: #8b949e; }
    .doc-text { font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Text', Georgia, serif; font-size: 15px; fill: #adbac7; line-height: 1.6; }
    .highlighted-text { fill: #ffffff; font-weight: 500; }
    .step-badge { font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Text', sans-serif; font-size: 11px; font-weight: bold; fill: #ffffff; }

    /* Emil Kowalski fluid animation timings */
    @keyframes dragCursor {
      0%, 12% {
        transform: translate(32px, 110px);
      }
      36%, 76% {
        transform: translate(562px, 110px);
      }
      84%, 100% {
        transform: translate(32px, 110px);
      }
    }

    @keyframes popToast {
      0%, 35% {
        opacity: 0;
        transform: translate(580px, 94px) scale(0.94);
      }
      40% {
        opacity: 1;
        transform: translate(580px, 88px) scale(1.02);
      }
      44%, 74% {
        opacity: 1;
        transform: translate(580px, 88px) scale(1);
      }
      80%, 100% {
        opacity: 0;
        transform: translate(580px, 92px) scale(0.96);
      }
    }

    .anim-cursor {
      animation: dragCursor 4.5s cubic-bezier(0.23, 1, 0.32, 1) infinite;
    }

    .anim-toast {
      animation: popToast 4.5s cubic-bezier(0.23, 1, 0.32, 1) infinite;
      transform-origin: 580px 88px;
    }

    @media (prefers-reduced-motion: reduce) {
      .anim-cursor, .anim-toast {
        animation: none;
      }
      #highlight-rect-clip {
        width: 530px;
      }
      .anim-toast {
        opacity: 1;
        transform: translate(580px, 88px) scale(1);
      }
    }
  </style>

  <!-- Background -->
  <rect width="1000" height="440" rx="16" fill="url(#copy-bg-grad)" stroke="#2d333b" stroke-width="1.5" />

  <!-- Section Header -->
  <g transform="translate(36, 32)">
    <text x="0" y="0" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Display', sans-serif" font-size="20" font-weight="700" fill="#ffffff">Universal Linux-Style Copy-on-Select (Zero Cmd+C)</text>
    <text x="0" y="22" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Text', sans-serif" font-size="13" fill="#8b949e">Highlight with cursor or double-click. Releasing mouse copies immediately with a tactile cursor HUD.</text>
  </g>

  <!-- Browser / Document Window Mockup -->
  <g transform="translate(48, 75)" filter="url(#copy-shadow)">
    <rect width="904" height="250" rx="12" fill="#12161f" stroke="#384252" stroke-width="1" />
    <rect width="904" height="34" rx="12" fill="#1b212c" />
    <circle cx="20" cy="17" r="4.5" fill="#ff5f56" />
    <circle cx="34" cy="17" r="4.5" fill="#ffbd2e" />
    <circle cx="48" cy="17" r="4.5" fill="#27c93f" />
    <!-- Browser URL bar -->
    <rect x="76" y="7" width="500" height="20" rx="6" fill="#12161f" />
    <text x="90" y="21" class="window-title" font-size="11">https://github.com/ellisglass/nnts</text>

    <!-- Document Content -->
    <g transform="translate(32, 60)">
      <text x="0" y="20" class="doc-text">
        In macOS, users execute hundreds of redundant <tspan font-family="monospace" fill="#58a6ff">Cmd + C</tspan> keystrokes every single day.
      </text>

      <!-- Base Text -->
      <text x="0" y="56" class="doc-text">
        NNTS eliminates 1,000 wasted keystrokes via Copy-on-Select.
      </text>

      <!-- Selection Highlight Overlay (Clipped dynamically) -->
      <g clip-path="url(#highlight-clip)">
        <rect x="0" y="38" width="530" height="26" rx="4" fill="#005fb8" opacity="0.85" />
        <text x="0" y="56" class="doc-text highlighted-text">
          NNTS eliminates 1,000 wasted keystrokes via Copy-on-Select.
        </text>
      </g>

      <text x="0" y="94" class="doc-text">
        Dragging while holding <tspan font-family="monospace" fill="#adbac7">Cmd</tspan> or <tspan font-family="monospace" fill="#adbac7">Ctrl</tspan> is preserved for multi-cursor editors. Trivial clicks (&lt;10pt) are ignored.
      </text>
    </g>

    <!-- Pointer Cursor (Animated) -->
    <g class="anim-cursor">
      <path d="M0,0 L0,18 L4.5,14 L8.5,22 L11.5,20.5 L7.5,12.5 L13,12.5 Z" fill="#ffffff" stroke="#000000" stroke-width="1.2" />
    </g>

    <!-- NNTS Copy Toast Window (Pill HUD, Animated per Sonner standards) -->
    <g class="anim-toast" filter="url(#toast-glow)">
      <rect width="168" height="38" rx="19" fill="#141820" stroke="#30D158" stroke-width="1.5" />
      <!-- Checkmark Icon -->
      <circle cx="22" cy="19" r="9" fill="#1f4028" />
      <path d="M17 19 L20 22 L27 15" fill="none" stroke="#30D158" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" />
      <text x="38" y="23" font-family="-apple-system, sans-serif" font-size="12" font-weight="bold" fill="#ffffff">Copied</text>
      <text x="86" y="23" font-family="monospace" font-size="11" fill="#8b949e">(62 chars)</text>
    </g>
  </g>

  <!-- 3 Invariants Footer -->
  <g transform="translate(48, 350)">
    <rect x="0" y="0" width="280" height="54" rx="8" fill="#181c24" stroke="#2d333b" stroke-width="1" />
    <text x="14" y="22" class="step-badge" fill="#30D158">⚡ Auto-Copy on Mouse Release</text>
    <text x="14" y="40" font-family="-apple-system, sans-serif" font-size="11" fill="#8b949e">Drag-select &gt;10pt or double-click to copy.</text>

    <rect x="312" y="0" width="280" height="54" rx="8" fill="#181c24" stroke="#2d333b" stroke-width="1" />
    <text x="326" y="22" class="step-badge" fill="#58A6FF">🛡️ Multi-Cursor Safe</text>
    <text x="326" y="40" font-family="-apple-system, sans-serif" font-size="11" fill="#8b949e">Cmd/Ctrl drags are never intercepted.</text>

    <rect x="624" y="0" width="280" height="54" rx="8" fill="#181c24" stroke="#2d333b" stroke-width="1" />
    <text x="638" y="22" class="step-badge" fill="#AF52DE">⏱️ Auto-Dismiss Toast (&lt;1.2s)</text>
    <text x="638" y="40" font-family="-apple-system, sans-serif" font-size="11" fill="#8b949e">Unobtrusive confirmation near cursor.</text>
  </g>
</svg>
