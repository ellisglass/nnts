<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 480" width="100%" height="auto">
  <defs>
    <linearGradient id="card-bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0e131b" />
      <stop offset="100%" stop-color="#161c26" />
    </linearGradient>
    <linearGradient id="hud-glass" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#232936" stop-opacity="0.92" />
      <stop offset="100%" stop-color="#131720" stop-opacity="0.96" />
    </linearGradient>
    <filter id="card-shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#000000" flood-opacity="0.5" />
    </filter>
    <filter id="active-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="0" stdDeviation="5" flood-color="#007AFF" flood-opacity="0.6" />
    </filter>
  </defs>

  <style>
    .mono-code { font-family: 'SF Mono', Menlo, Monaco, Consolas, monospace; font-size: 11px; fill: #adbac7; }
    .card-title { font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Text', sans-serif; font-size: 13px; font-weight: 600; fill: #ffffff; }
    .badge-key { font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Display', monospace; font-size: 12px; font-weight: bold; fill: #ffffff; }
  </style>

  <!-- Background -->
  <rect width="1000" height="480" rx="16" fill="url(#card-bg-grad)" stroke="#2d333b" stroke-width="1.5" />

  <!-- Section Header -->
  <g transform="translate(36, 32)">
    <text x="0" y="0" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Display', sans-serif" font-size="20" font-weight="700" fill="#ffffff">Mnemonic First-Letter App Switching (Under 16ms)</text>
    <text x="0" y="22" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Text', sans-serif" font-size="13" fill="#8b949e">No search modals, no typing queries. Just hold Caps Lock and tap the first letter.</text>
  </g>

  <!-- 4 Realistic macOS Tool Windows -->

  <!-- Window 1: Terminal (Ghostty) [Caps + T] -->
  <g transform="translate(36, 75)" filter="url(#card-shadow)">
    <rect width="215" height="230" rx="10" fill="#12161f" stroke="#30D158" stroke-width="1.5" />
    <rect width="215" height="28" rx="10" fill="#1c222e" />
    <circle cx="16" cy="14" r="4" fill="#ff5f56" />
    <circle cx="28" cy="14" r="4" fill="#ffbd2e" />
    <circle cx="40" cy="14" r="4" fill="#27c93f" />
    <text x="56" y="18" class="card-title" font-size="11">Ghostty — Caps+T</text>
    <rect x="175" y="6" width="30" height="16" rx="4" fill="#30D158" />
    <text x="190" y="18" class="badge-key" text-anchor="middle" font-size="10">T</text>

    <!-- Terminal Content -->
    <text x="14" y="52" class="mono-code" fill="#30D158">~ $ <tspan fill="#e6edf3">git status</tspan></text>
    <text x="14" y="72" class="mono-code" fill="#768390">On branch main</text>
    <text x="14" y="90" class="mono-code" fill="#768390">up to date with 'origin'</text>
    <text x="14" y="116" class="mono-code" fill="#30D158">~ $ <tspan fill="#e6edf3">swift test</tspan></text>
    <text x="14" y="136" class="mono-code" fill="#52E075">✔ 99/99 passed</text>
    <text x="14" y="156" class="mono-code" fill="#768390">Latency: 11.2ms</text>
    <rect x="14" y="172" width="6" height="12" fill="#30D158" />
  </g>

  <!-- Window 2: IDE (Cursor / VS Code) [Caps + I] -->
  <g transform="translate(270, 75)" filter="url(#card-shadow)">
    <rect width="215" height="230" rx="10" fill="#12161f" stroke="#5856D6" stroke-width="1.5" />
    <rect width="215" height="28" rx="10" fill="#1c222e" />
    <circle cx="16" cy="14" r="4" fill="#ff5f56" />
    <circle cx="28" cy="14" r="4" fill="#ffbd2e" />
    <circle cx="40" cy="14" r="4" fill="#27c93f" />
    <text x="56" y="18" class="card-title" font-size="11">IDE — Caps+I</text>
    <rect x="175" y="6" width="30" height="16" rx="4" fill="#5856D6" />
    <text x="190" y="18" class="badge-key" text-anchor="middle" font-size="10">I</text>

    <!-- Code Content -->
    <text x="14" y="52" class="mono-code" fill="#F05138">import <tspan fill="#ffffff">SwiftUI</tspan></text>
    <text x="14" y="74" class="mono-code" fill="#AF52DE">struct <tspan fill="#64D2FF">CockpitView</tspan>: <tspan fill="#ffffff">View</tspan> {</text>
    <text x="24" y="94" class="mono-code" fill="#adbac7">var body: some View {</text>
    <text x="34" y="114" class="mono-code" fill="#64D2FF">MinimalHUD()</text>
    <text x="44" y="134" class="mono-code" fill="#768390">.sub16ms()</text>
    <text x="24" y="154" class="mono-code" fill="#adbac7">}</text>
    <text x="14" y="174" class="mono-code" fill="#adbac7">}</text>
  </g>

  <!-- Window 3: AI Agent (Antigravity) [Caps + A] -->
  <g transform="translate(504, 75)" filter="url(#card-shadow)">
    <rect width="215" height="230" rx="10" fill="#12161f" stroke="#FF2D55" stroke-width="1.5" />
    <rect width="215" height="28" rx="10" fill="#1c222e" />
    <circle cx="16" cy="14" r="4" fill="#ff5f56" />
    <circle cx="28" cy="14" r="4" fill="#ffbd2e" />
    <circle cx="40" cy="14" r="4" fill="#27c93f" />
    <text x="56" y="18" class="card-title" font-size="11">Agent — Caps+A</text>
    <rect x="175" y="6" width="30" height="16" rx="4" fill="#FF2D55" />
    <text x="190" y="18" class="badge-key" text-anchor="middle" font-size="10">A</text>

    <!-- AI Agent Content -->
    <text x="14" y="52" class="mono-code" fill="#FF2D55">● Antigravity 2.0</text>
    <text x="14" y="74" class="mono-code" fill="#adbac7">Synthesizing plan:</text>
    <text x="14" y="96" class="mono-code" fill="#52E075">✓ Clean architecture</text>
    <text x="14" y="116" class="mono-code" fill="#52E075">✓ Zero kext footprint</text>
    <text x="14" y="136" class="mono-code" fill="#52E075">✓ Sub-16ms latency</text>
    <text x="14" y="162" class="mono-code" fill="#768390">Streaming response...</text>
  </g>

  <!-- Window 4: Notes (Obsidian) [Caps + N] -->
  <g transform="translate(738, 75)" filter="url(#card-shadow)">
    <rect width="226" height="230" rx="10" fill="#12161f" stroke="#FF9F0A" stroke-width="1.5" />
    <rect width="226" height="28" rx="10" fill="#1c222e" />
    <circle cx="16" cy="14" r="4" fill="#ff5f56" />
    <circle cx="28" cy="14" r="4" fill="#ffbd2e" />
    <circle cx="40" cy="14" r="4" fill="#27c93f" />
    <text x="56" y="18" class="card-title" font-size="11">Notes — Caps+N</text>
    <rect x="186" y="6" width="30" height="16" rx="4" fill="#FF9F0A" />
    <text x="201" y="18" class="badge-key" text-anchor="middle" font-size="10">N</text>

    <!-- Markdown Content -->
    <text x="14" y="52" class="mono-code" fill="#FF9F0A" font-weight="bold"># Architecture Notes</text>
    <text x="14" y="74" class="mono-code" fill="#adbac7">- [x] Pure native Swift 6</text>
    <text x="14" y="96" class="mono-code" fill="#adbac7">- [x] Driverless IOHID F18</text>
    <text x="14" y="118" class="mono-code" fill="#adbac7">- [x] Chrome profile jump</text>
    <text x="14" y="140" class="mono-code" fill="#adbac7">- [x] Copy-on-select toast</text>
    <text x="14" y="162" class="mono-code" fill="#52E075">Status: Ready to Ship</text>
  </g>

  <!-- Floating NNTS HUD Overlay (Appears in center of screen) -->
  <g transform="translate(230, 335)" filter="url(#card-shadow)">
    <rect width="540" height="105" rx="24" fill="url(#hud-glass)" stroke="rgba(255,255,255,0.2)" stroke-width="1" />

    <!-- Card 1: Terminal (Active/Selected) -->
    <g transform="translate(18, 14)">
      <rect width="90" height="76" rx="14" fill="rgba(255,255,255,0.18)" stroke="#30D158" stroke-width="2" filter="url(#active-glow)" />
      <text x="45" y="32" font-family="-apple-system, sans-serif" font-size="22" text-anchor="middle">💻</text>
      <text x="45" y="52" font-family="-apple-system, sans-serif" font-size="11" font-weight="bold" fill="#ffffff" text-anchor="middle">Terminal</text>
      <text x="45" y="66" font-family="monospace" font-size="9" fill="#30D158" text-anchor="middle">[ T ]</text>
    </g>

    <!-- Card 2: IDE -->
    <g transform="translate(122, 14)">
      <rect width="90" height="76" rx="14" fill="rgba(255,255,255,0.06)" stroke="rgba(255,255,255,0.12)" stroke-width="1" />
      <text x="45" y="32" font-family="-apple-system, sans-serif" font-size="22" text-anchor="middle">🛠️</text>
      <text x="45" y="52" font-family="-apple-system, sans-serif" font-size="11" font-weight="600" fill="#adbac7" text-anchor="middle">IDE</text>
      <text x="45" y="66" font-family="monospace" font-size="9" fill="#8b949e" text-anchor="middle">[ I ]</text>
    </g>

    <!-- Card 3: AI Agent -->
    <g transform="translate(226, 14)">
      <rect width="90" height="76" rx="14" fill="rgba(255,255,255,0.06)" stroke="rgba(255,255,255,0.12)" stroke-width="1" />
      <text x="45" y="32" font-family="-apple-system, sans-serif" font-size="22" text-anchor="middle">🧠</text>
      <text x="45" y="52" font-family="-apple-system, sans-serif" font-size="11" font-weight="600" fill="#adbac7" text-anchor="middle">AI Agent</text>
      <text x="45" y="66" font-family="monospace" font-size="9" fill="#8b949e" text-anchor="middle">[ A ]</text>
    </g>

    <!-- Card 4: Notes -->
    <g transform="translate(330, 14)">
      <rect width="90" height="76" rx="14" fill="rgba(255,255,255,0.06)" stroke="rgba(255,255,255,0.12)" stroke-width="1" />
      <text x="45" y="32" font-family="-apple-system, sans-serif" font-size="22" text-anchor="middle">📝</text>
      <text x="45" y="52" font-family="-apple-system, sans-serif" font-size="11" font-weight="600" fill="#adbac7" text-anchor="middle">Notes</text>
      <text x="45" y="66" font-family="monospace" font-size="9" fill="#8b949e" text-anchor="middle">[ N ]</text>
    </g>

    <!-- Card 5: Finder -->
    <g transform="translate(434, 14)">
      <rect width="90" height="76" rx="14" fill="rgba(255,255,255,0.06)" stroke="rgba(255,255,255,0.12)" stroke-width="1" />
      <text x="45" y="32" font-family="-apple-system, sans-serif" font-size="22" text-anchor="middle">📂</text>
      <text x="45" y="52" font-family="-apple-system, sans-serif" font-size="11" font-weight="600" fill="#adbac7" text-anchor="middle">Finder</text>
      <text x="45" y="66" font-family="monospace" font-size="9" fill="#8b949e" text-anchor="middle">[ F ]</text>
    </g>
  </g>
</svg>
