  <script>
    (function () {
      const root = document.getElementById('search');
      const headerBlock = document.getElementById('header-block');
      const pickerWindow = document.getElementById('picker-window');
      const placeholderText = document.getElementById('placeholder-text');
      const typedText = document.getElementById('typed-text');
      const searchCursor = document.getElementById('search-cursor');
      const resultRow = document.getElementById('result-row');
      const pinBtn = document.getElementById('pin-btn');
      const pinBtnText = document.getElementById('pin-btn-text');
      const statusToast = document.getElementById('status-toast');
      const cursor = document.getElementById('virtual-cursor');
      const operator = document.getElementById('ambient-operator');

      // Static initial placements (frame 0 visible to avoid first_frame_empty)
      gsap.set(headerBlock, { opacity: 1, y: 0 });
      gsap.set(pickerWindow, { opacity: 1, scale: 1, y: 0 });
      gsap.set(resultRow, { opacity: 0, y: 12 });
      gsap.set(cursor, { opacity: 0, x: 900, y: 450 });
      gsap.set(statusToast, { opacity: 0, y: 15 });
      gsap.set(operator, { opacity: 0.28, y: 0 });

      const tl = gsap.timeline({ paused: true });

      // Subtle intro settle from frame 0
      tl.from(headerBlock, { y: -10, duration: 0.5, ease: 'power2.out' }, 0);
      tl.from(pickerWindow, { scale: 0.98, duration: 0.6, ease: 'power2.out' }, 0);
      tl.from(operator, { opacity: 0.08, y: 15, duration: 0.8, ease: 'power2.out' }, 0.1);

      // 0.8s - 2.8s: Cursor glides into search bar and text types "Client"
      tl.to(cursor, { opacity: 1, x: 420, y: 220, duration: 0.6, ease: 'power2.out' }, 0.8);
      tl.to(placeholderText, { opacity: 0, duration: 0.25, ease: 'power1.out' }, 1.4);

      const targetText = 'Client';
      for (let i = 1; i <= targetText.length; i++) {
        const partial = targetText.slice(0, i);
        tl.call(() => { typedText.textContent = partial; }, null, 1.5 + (i * 0.16));
      }

      // 2.4s - 3.0s: Filtered result row slides in with spring
      tl.to(resultRow, {
        opacity: 1,
        y: 0,
        backgroundColor: 'rgba(245, 186, 19, 0.12)',
        borderColor: 'rgba(245, 186, 19, 0.50)',
        duration: 0.45,
        ease: 'back.out(1.4)'
      }, 2.4);

      // 3.2s - 4.2s: Cursor glides directly to "Pin to Slot 3" button
      tl.to(cursor, { x: 1120, y: 350, duration: 0.8, ease: 'power2.inOut' }, 3.2);

      // 4.2s - 4.5s: Visible click action
      tl.to(cursor, { scale: 0.84, duration: 0.12, yoyo: true, repeat: 1, ease: 'power1.inOut' }, 4.3);
      tl.to(pinBtn, { scale: 0.94, duration: 0.12, ease: 'power1.in' }, 4.3);

      // 4.5s: Tactile button snap to Pinned state + Confirmation Toast
      tl.call(() => {
        pinBtn.classList.add('pinned-state');
        pinBtnText.textContent = '✓ Pinned';
      }, null, 4.45);
      tl.to(pinBtn, { scale: 1.04, duration: 0.18, ease: 'back.out(2)' }, 4.45);
      tl.to(pinBtn, { scale: 1.0, duration: 0.15, ease: 'power1.out' }, 4.65);

      // Status toast appears right away at t=4.5s
      tl.to(statusToast, { opacity: 1, y: 0, duration: 0.4, ease: 'back.out(1.5)' }, 4.5);
      tl.to(cursor, { opacity: 0, x: 1220, y: 420, duration: 0.5, ease: 'power2.in' }, 5.2);

      // 6.5s - 7.5s: Smooth exit transition
      tl.to([headerBlock, pickerWindow, statusToast, operator], {
        opacity: 0,
        y: -15,
        duration: 0.6,
        ease: 'power2.in'
      }, 6.8);

      window.__timelines = window.__timelines || {};
      window.__timelines["search"] = tl;
      if (window.__registerTimeline) {
        window.__registerTimeline('search', tl);
      }
    })();
  </script>
