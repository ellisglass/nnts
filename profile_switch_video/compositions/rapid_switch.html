        btnCap3.classList.toggle('is-depressed', slot === 3);
      }

      function addIRFlash(timeline, atTime) {
        timeline.set([irHalo, irBeam], { opacity: 1, scale: 1.1 }, atTime);
        timeline.to(irHalo, { scale: 2.2, opacity: 0, duration: 0.24, ease: 'power2.out' }, atTime);
        timeline.to(irBeam, { scaleY: 1.8, opacity: 0, duration: 0.20, ease: 'power2.out' }, atTime);
      }

      // Static initial setups outside timeline (visible on frame 0 to avoid first_frame_empty)
      gsap.set(headerBlock, { opacity: 1, y: 0 });
      gsap.set(telemetryBar, { opacity: 1, scale: 1 });
      gsap.set(hudWindow, { opacity: 1, scale: 1 });
      gsap.set(focusRing, { x: 0 }); // At Avatar 1 (slot 1)
      gsap.set(operator, { opacity: 0.35, y: 0 });
      gsap.set(remoteStage, { opacity: 1, y: 0 });
      setRemoteButtonActive(1);

      const tl = gsap.timeline({ paused: true });

      // Settle motion starting at 0s
      tl.from(headerBlock, { y: -10, duration: 0.4, ease: 'power2.out' }, 0);
      tl.from(telemetryBar, { scale: 0.96, duration: 0.4, ease: 'back.out(1.4)' }, 0);
      tl.from(hudWindow, { scale: 0.98, duration: 0.5, ease: 'back.out(1.2)' }, 0);
      tl.from(operator, { opacity: 0.1, y: 15, duration: 0.6, ease: 'power2.out' }, 0);
      tl.from(remoteStage, { y: 20, opacity: 0.4, duration: 0.5, ease: 'back.out(1.3)' }, 0);

      // State 1: Slot 1 (Personal) is active from start
      tl.call(() => {
        keyDigit.textContent = '1';
        keyDigit.classList.add('active-digit');
        setRemoteButtonActive(1);
      }, null, 0.1);
      addIRFlash(tl, 0.1);

      // 0.9s: Start glide to Profile 2 (Work)
      tl.to(focusRing, { x: 118, duration: 0.35, ease: 'back.out(1.5)' }, 0.9);
      tl.call(() => {
        keyDigit.textContent = '2';
        keyDigit.classList.add('active-digit');

        badgePersonal.classList.remove('selected-badge');
        badgeWork.classList.add('selected-badge');
        badgeClient.classList.remove('selected-badge');

        pipPersonal.classList.remove('is-live');
        pipWork.classList.add('is-live');
        pipClient.classList.remove('is-live');

        hudTitle.textContent = 'Work';
        hudSub.className = 'hud-profile-sub active-now';
        hudSubText.textContent = 'Active Now • caps lock + 2';
        hudSubDot.style.display = 'block';

        // Remote Button 2 visibly depresses (scale down 0.92 + shadow shift)
        setRemoteButtonActive(2);

        // Window stack swap: Work rises to front
        winPersonal.className = 'chrome-window';
        winPersonal.style.zIndex = '10';
        winWork.className = 'chrome-window is-raised';
        winWork.style.zIndex = '15';
        winClient.className = 'chrome-window';
        winClient.style.zIndex = '11';
      }, null, 0.95);
      addIRFlash(tl, 0.95);

      // 2.6s: Start glide to Profile 3 (Client)
      tl.to(focusRing, { x: 236, duration: 0.35, ease: 'back.out(1.5)' }, 2.6);
      tl.call(() => {
        keyDigit.textContent = '3';
        keyDigit.classList.add('active-digit');

        badgePersonal.classList.remove('selected-badge');
        badgeWork.classList.remove('selected-badge');
        badgeClient.classList.add('selected-badge');

        pipPersonal.classList.remove('is-live');
        pipWork.classList.remove('is-live');
        pipClient.classList.add('is-live');

        hudTitle.textContent = 'Client';
        hudSub.className = 'hud-profile-sub active-now';
        hudSubText.textContent = 'Active Now • caps lock + 3';
        hudSubDot.style.display = 'block';

        // Remote Button 3 visibly depresses (scale down 0.92 + shadow shift)
        setRemoteButtonActive(3);

        // Window stack swap: Client rises to front
        winPersonal.className = 'chrome-window';
        winPersonal.style.zIndex = '10';
        winWork.className = 'chrome-window';
        winWork.style.zIndex = '11';
        winClient.className = 'chrome-window is-raised';
        winClient.style.zIndex = '16';
      }, null, 2.65);
      addIRFlash(tl, 2.65);

      // 4.6s: Modifier released! HUD & Telemetry bar hide immediately (as in MinimalHUDWindow.shared.hideImmediate())
      tl.to([hudWindow, telemetryBar], { opacity: 0, scale: 0.96, duration: 0.25, ease: 'power2.in' }, 4.6);
      tl.call(() => {
        // Physical remote button releases upon modifier release
        setRemoteButtonActive(null);
      }, null, 4.6);

      // Client window remains proudly raised and focused on screen
      tl.to(winClient, { scale: 1.02, duration: 0.4, ease: 'power2.out' }, 4.9);

      // 6.2s - 7.0s: Out transition
      tl.to([headerBlock, winPersonal, winWork, winClient, remoteStage, operator], {
        opacity: 0,
        y: -15,
        duration: 0.5,
        ease: 'power2.in'
      }, 6.3);

      window.__timelines = window.__timelines || {};
      window.__timelines["rapid_switch"] = tl;
      if (window.__registerTimeline) {
        window.__registerTimeline('rapid_switch', tl);
      }
    })();
  </script>
</template>
